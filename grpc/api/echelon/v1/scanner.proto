syntax = "proto3";

package echelon.v1;

option go_package = "echelon-utility/grpc/api/echelon/v1;echelonv1";

service ScannerService {
  rpc Scan(ScanRequest) returns (ScanResponse);
}

message ScanRequest {
  // Имя с расширением .json, .yaml или .yml. Если имя пустое сервер попытается определить формат по содержимому
  string source_name = 1;
  bytes content = 2;
}

message ScanResponse {
  repeated Finding findings = 1;
}

message Finding {
  string severity = 1;
  string rule = 2;
  string path = 3;
  string message = 4;
  string recommendation = 5;
}
